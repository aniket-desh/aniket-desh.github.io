<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" href="/assets/penrose.png" type="image/x-icon" />
    <title>drosophila — aniket deshpande</title>
    <meta name="description" content="Short notes on minimal models of the world.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&amp;family=Alegreya+SC:wght@400;500&amp;display=swap" rel="stylesheet">
  <script type="text/javascript" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        ::selection {
            background: #f9e6e6;
        }

        ::-moz-selection {
            background: #f9e6e6;
        }

        html {
            overflow-x: hidden;
            overflow-y: scroll;
        }

        body {
            margin: 0;
            padding: 0;
            background: #fff;
            font-family: "Alegreya", Georgia, "Times New Roman", serif;
            font-size: 17.6px;
            font-weight: 400;
            line-height: 1.5;
            font-optical-sizing: auto;
            font-variant-numeric: oldstyle-nums;
            font-feature-settings: "onum";
        }

        a {
            color: #434c5e;
            text-decoration: underline;
        }

        a:hover {
            color: #434c5e;
        }

        .container {
            width: min(100% - 48px, 620px);
            margin: 0 auto;
            padding: 120px 0 88px;
        }

        @media screen and (max-width: 640px) {
            .container {
                width: min(100% - 32px, 620px);
                padding: 64px 0 64px;
            }
        }

        .bio {
            max-width: none;
        }

        .bio__header {
            margin-bottom: 20px;
            font-weight: 400;
            font-size: 25.3px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-family: "Alegreya", Georgia, "Times New Roman", serif;
        }

        .bio__header a {
            text-decoration: none;
            color: inherit;
        }

        .bio__header a:hover {
            text-decoration: none;
        }

        .bio__header .home-otimes {
            color: #434c5e;
            font-size: 22px;
        }

        .bio__header .home-otimes:hover {
            color: #434c5e;
        }

        .bio__tabs {
            margin-bottom: 20px;
            font-style: italic;
        }

        .bio__tabs a {
            text-decoration: none;
            color: inherit;
        }

        .bio__tabs a:hover {
            color: #434c5e;
        }

        .content {
            width: 100%;
            max-width: none;
        }

        .page-title {
            font-weight: 500;
            font-size: 20px;
            margin-bottom: 10px;
            font-family: "Alegreya", Georgia, "Times New Roman", serif;
        }

        .page-desc {
            font-style: italic;
            margin-bottom: 30px;
        }

        .post-entry {
            margin-bottom: 25px;
        }

        .post-entry h3 {
            font-weight: 500;
            font-size: 17px;
            margin: 0 0 5px 0;
            font-family: "Alegreya", Georgia, "Times New Roman", serif;
        }

        .post-entry p {
            margin: 0;
            font-style: normal;
        }

        .post-entry a.read-more {
            text-decoration: none;
            color: gray;
            font-style: italic;
        }

        .post-entry a.read-more:hover {
            color: #434c5e;
        }

        .post-entry.hidden {
            display: none;
        }

        .tag-filters {
            margin-bottom: 25px;
            margin-top: -10px;
        }

        .tag-btn {
            font-family: inherit;
            font-size: 14px;
            font-style: italic;
            background: none;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 3px 12px;
            cursor: pointer;
            color: #999;
            transition: all 0.15s ease;
            margin-right: 4px;
        }

        .tag-btn:hover {
            background: #f5f5f5;
            color: #555;
        }

        .tag-btn.active {
            background: #333;
            color: #fff;
            border-color: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="bio__header">
            <a href="/">drosophila</a>
            <a href="/" class="home-otimes" aria-label="home">&otimes;</a>
        </div>

        <div class="content">
            <div class="tag-filters">
                <button class="tag-btn active" data-tag="all">all</button>
                <button class="tag-btn" data-tag="physics">physics</button>
                <button class="tag-btn" data-tag="complexity">complexity</button>
                <button class="tag-btn" data-tag="math">math</button>
            </div>

            <div class="post-entry" data-tag="math">
                <h3>Fourier methods and symmetry</h3>
                <a href="/drosophila/fourier-methods-and-symmetry/" class="read-more">read more →</a>
            </div>

            <div class="post-entry" data-tag="physics">
                <h3>Ising Model</h3>
                <a href="/drosophila/ising-model/" class="read-more">read more →</a>
            </div>
        </div>
    </div>
    <script>
        document.querySelectorAll('.tag-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tag-btn').forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                var tag = btn.getAttribute('data-tag');
                document.querySelectorAll('.post-entry').forEach(function(entry) {
                    if (tag === 'all' || entry.getAttribute('data-tag') === tag) {
                        entry.classList.remove('hidden');
                    } else {
                        entry.classList.add('hidden');
                    }
                });
            });
        });
    </script>
</body>
</html>
